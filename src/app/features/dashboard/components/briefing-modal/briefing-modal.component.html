<!-- SABAH BRİFİNGİ & GÖREV DAĞITIMI MODALI -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 md:p-6 bg-slate-950/80 backdrop-blur-md animate-in fade-in duration-200">
  <!-- Backdrop click -->
  <div class="fixed inset-0" (click)="close.emit()"></div>

  <!-- Modal Dialog -->
  <div
    class="relative z-10 w-full max-w-2xl max-h-[92vh] flex flex-col rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-2xl overflow-hidden"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 dark:border-slate-800 bg-gradient-to-r from-amber-500/10 via-emerald-500/10 to-transparent">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-emerald-500 text-white flex items-center justify-center shadow-lg shadow-amber-500/20">
          <mat-icon class="icon-size-5" [svgIcon]="'heroicons_outline:sun'"></mat-icon>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h2 class="text-base font-bold text-slate-900 dark:text-white tracking-tight">
              Günün Sabah Brifingi
            </h2>
            <span class="px-2 py-0.5 text-[10px] font-black rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800">
              WhatsApp & SMS
            </span>
          </div>
          <p class="text-xs text-slate-500 dark:text-slate-400">
            {{ summary.dateFormatted }} • {{ summary.farmName }}
          </p>
        </div>
      </div>

      <button
        type="button"
        (click)="close.emit()"
        class="p-2 rounded-xl text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
      >
        <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:x'"></mat-icon>
      </button>
    </div>

    <!-- Scrollable Body -->
    <div class="flex-1 overflow-y-auto p-6 space-y-5 custom-scroll">
      <!-- Section Customization Options -->
      <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-850/60 border border-slate-200/80 dark:border-slate-800 space-y-3">
        <div class="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider">
          Brifinge Dahil Edilecek Bölümler
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
          <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 dark:text-slate-300 cursor-pointer select-none">
            <input
              type="checkbox"
              [(ngModel)]="options.includeBirths"
              (change)="onOptionToggle()"
              class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 cursor-pointer"
            />
            <span>🍼 Doğumlar ({{ summary.upcomingBirths.length }})</span>
          </label>

          <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 dark:text-slate-300 cursor-pointer select-none">
            <input
              type="checkbox"
              [(ngModel)]="options.includePregnancyChecks"
              (change)="onOptionToggle()"
              class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 cursor-pointer"
            />
            <span>🔍 Kontroller ({{ summary.pregnancyChecks.length }})</span>
          </label>

          <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 dark:text-slate-300 cursor-pointer select-none">
            <input
              type="checkbox"
              [(ngModel)]="options.includeTreatments"
              (change)="onOptionToggle()"
              class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 cursor-pointer"
            />
            <span>💉 Aşı/Sağlık ({{ summary.todayTreatments.length }})</span>
          </label>

          <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 dark:text-slate-300 cursor-pointer select-none">
            <input
              type="checkbox"
              [(ngModel)]="options.includeTasks"
              (change)="onOptionToggle()"
              class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 cursor-pointer"
            />
            <span>📋 Görevler ({{ summary.pendingTasks.length }})</span>
          </label>

          <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 dark:text-slate-300 cursor-pointer select-none">
            <input
              type="checkbox"
              [(ngModel)]="options.includeStock"
              (change)="onOptionToggle()"
              class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 cursor-pointer"
            />
            <span>⚠️ Stok ({{ summary.lowStockItems.length }})</span>
          </label>

          <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 dark:text-slate-300 cursor-pointer select-none">
            <input
              type="checkbox"
              [(ngModel)]="options.includeYields"
              (change)="onOptionToggle()"
              class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 cursor-pointer"
            />
            <span>🥛 Süt Verimi</span>
          </label>
        </div>
      </div>

      <!-- Custom Note & Recipient Phone -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">
            Yönetici Özel Notu (Opsiyonel)
          </label>
          <input
            type="text"
            [(ngModel)]="customNote"
            (ngModelChange)="onCustomNoteChange()"
            placeholder="Örn: Bugün saat 11'de veteriner gelecek..."
            class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:ring-2 focus:ring-emerald-500/20 focus:outline-none"
          />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">
            Hedef Telefon No (Opsiyonel)
          </label>
          <input
            type="text"
            [(ngModel)]="recipientPhone"
            placeholder="Örn: 905XXXXXXXXX veya boş bırakın"
            class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:ring-2 focus:ring-emerald-500/20 focus:outline-none"
          />
        </div>
      </div>

      <!-- Live Message Preview Box -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-xs font-bold text-slate-700 dark:text-slate-300">
            Hazırlanan Mesaj Önizlemesi (WhatsApp / SMS Formatı)
          </span>
          <button
            type="button"
            (click)="copyMessage()"
            class="text-[11px] font-bold text-emerald-600 dark:text-emerald-400 hover:underline flex items-center gap-1"
          >
            <mat-icon class="icon-size-3.5" [svgIcon]="'heroicons_outline:clipboard-copy'"></mat-icon>
            <span>Panoya Kopyala</span>
          </button>
        </div>

        <div class="relative p-4 rounded-2xl bg-slate-900 border border-slate-800 font-mono text-xs text-emerald-300/90 whitespace-pre-wrap leading-relaxed shadow-inner max-h-72 overflow-y-auto custom-scroll">
          {{ summary.messageText }}
        </div>
      </div>
    </div>

    <!-- Footer Actions -->
    <div class="px-6 py-4 border-t border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-850 flex flex-wrap items-center justify-between gap-3">
      <button
        type="button"
        (click)="copyMessage()"
        class="px-4 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer"
      >
        <mat-icon class="icon-size-4" [svgIcon]="'heroicons_outline:clipboard-copy'"></mat-icon>
        <span>Kopyala</span>
      </button>

      <div class="flex items-center gap-2">
        <button
          type="button"
          (click)="sendSms()"
          class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold transition-all shadow-md shadow-blue-600/20 flex items-center gap-1.5 cursor-pointer"
        >
          <mat-icon class="icon-size-4" [svgIcon]="'heroicons_outline:chat'"></mat-icon>
          <span>SMS ile Gönder</span>
        </button>

        <button
          type="button"
          (click)="sendWhatsApp()"
          class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black transition-all shadow-lg shadow-emerald-600/30 flex items-center gap-2 cursor-pointer active:scale-95"
        >
          <mat-icon class="icon-size-4.5" [svgIcon]="'heroicons_solid:paper-airplane'"></mat-icon>
          <span>WhatsApp ile Paylaş</span>
        </button>
      </div>
    </div>
  </div>
</div>
